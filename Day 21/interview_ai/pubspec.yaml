name: top_5_packages_app
description: "Top 5 Flutter Packages Demo - GetX, Freezed, GoRouter, Dio, Hive"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Package 1: GetX - State Management, Navigation, DI
  get: ^4.7.2
  
  # Package 2: Freezed - Immutable data classes
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  # Package 3: GoRouter - Declarative routing
  go_router: ^16.0.0
  
  # Package 4: Dio - Advanced HTTP client
  dio: ^5.9.0
  
  # Package 5: Hive - NoSQL local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utility Packages
  intl: ^0.20.2
  url_launcher: ^6.3.2
  share_plus: ^12.0.0
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Freezed code generation
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true