name: vibez_app
description: "Vibez - Social Media App with Real-time Chat."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  firebase_storage: ^12.4.4
  cloud_firestore: ^5.6.5
  firebase_messaging: ^15.2.4
  google_sign_in: ^6.2.2
  
  # State Management
  get: ^4.7.3
  
  # Image Picker
  image_picker: ^1.1.2
  image_cropper: ^8.1.0
  
  # UI Components
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17
  intl: ^0.20.2
  timeago: ^3.7.0
  flutter_local_notifications: ^18.0.1
  
  # Utilities
  uuid: ^4.5.1
  path: ^1.9.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/